<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    /* Внешний слой = положение/масштаб/появление */
    #portraitScaleWrap {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(60vw, 380px);
      aspect-ratio: 4 / 5;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(var(--ar-scale));
      transition: opacity 700ms ease, transform 120ms linear;
      will-change: transform, opacity;
    }

    #portraitScaleWrap.visible {
      opacity: 1;
    }

    /* Внутренний слой = медленный учтивый кивок */
    #portraitPose {
      position: absolute;
      inset: 0;
      transform-origin: 50% 82%;
      will-change: transform;
    }

    #portraitPose.nod {
      animation: courteousNod 4.8s cubic-bezier(.42,0,.22,1) 1;
    }

    /* Медленный, учтивый, с небольшой паузой в нижней точке */
    @keyframes courteousNod {
      0%, 100% {
        transform: translateY(0px) scaleY(1);
      }
      24% {
        transform: translateY(0px) scaleY(1);
      }
      44% {
        transform: translateY(4px) scaleY(0.994);
      }
      58% {
        transform: translateY(9px) scaleY(0.984);
      }
      66% {
        transform: translateY(10px) scaleY(0.982);
      }
      74% {
        transform: translateY(9px) scaleY(0.984);
      }
      86% {
        transform: translateY(4px) scaleY(0.994);
      }
    }

    #portraitPose img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #openImg {
      opacity: 1;
    }

    #blinkImg {
      opacity: 0;
      transition: opacity 80ms linear;
    }

    #portraitPose.blink #blinkImg {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="portraitScaleWrap">
    <div id="portraitPose">
      <img id="openImg" src="./goethe_open.png" alt="">
      <img id="blinkImg" src="./goethe_blink.png" alt="">
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 24;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.getElementById('scene');
      const target = document.getElementById('goetheTarget');
      const scaleWrap = document.getElementById('portraitScaleWrap');
      const pose = document.getElementById('portraitPose');

      let active = false;
      let hideTimer = null;
      let nodTimer = null;
      let blinkTimer = null;

      // Масштабирование с фильтрацией дрожи
      let baselineProjectedWidth = null;
      let widthSamples = [];
      let filteredWidth = null;
      let targetScale = 1.0;
      let currentScale = 1.0;

      const leftLocal = new THREE.Vector3(-0.5, 0, 0);
      const rightLocal = new THREE.Vector3(0.5, 0, 0);
      const leftWorld = new THREE.Vector3();
      const rightWorld = new THREE.Vector3();

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function median(a) {
        if (!a.length) return null;
        const s = [...a].sort((x, y) => x - y);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
      }

      function getProjectedTargetWidth() {
        const cam = scene.camera;
        if (!cam || !target.object3D) return null;

        target.object3D.updateMatrixWorld(true);
        cam.updateMatrixWorld(true);

        leftWorld.copy(leftLocal).applyMatrix4(target.object3D.matrixWorld).project(cam);
        rightWorld.copy(rightLocal).applyMatrix4(target.object3D.matrixWorld).project(cam);

        const w = Math.abs(rightWorld.x - leftWorld.x);
        if (!Number.isFinite(w) || w < 0.001 || w > 5) return null;
        return w;
      }

      function updateScale() {
        if (active) {
          const measuredWidth = getProjectedTargetWidth();

          if (measuredWidth) {
            if (!baselineProjectedWidth) {
              widthSamples.push(measuredWidth);
              if (widthSamples.length >= 14) {
                baselineProjectedWidth = median(widthSamples);
                filteredWidth = baselineProjectedWidth;
                widthSamples = [];
              }
            } else {
              filteredWidth += (measuredWidth - filteredWidth) * 0.08;

              let rawScale = filteredWidth / baselineProjectedWidth;
              rawScale = clamp(rawScale, 0.68, 1.55);

              if (Math.abs(rawScale - targetScale) > 0.045) {
                targetScale = rawScale;
              }

              const delta = targetScale - currentScale;
              let step = delta * 0.07;
              step = clamp(step, -0.006, 0.006);
              currentScale += step;

              scaleWrap.style.setProperty('--ar-scale', currentScale.toFixed(4));
            }
          }
        }

        requestAnimationFrame(updateScale);
      }

      function blinkOnce() {
        if (!active) return;
        pose.classList.add('blink');
        setTimeout(() => pose.classList.remove('blink'), 155);
      }

      function doCourteousNod() {
        if (!active) return;

        pose.classList.remove('nod');
        void pose.offsetWidth;
        pose.classList.add('nod');

        // Очень деликатное моргание ближе к нижней точке кивка
        setTimeout(() => {
          if (active) blinkOnce();
        }, 2450);

        setTimeout(() => pose.classList.remove('nod'), 4850);
      }

      function scheduleNextNod() {
        clearTimeout(nodTimer);
        nodTimer = setTimeout(() => {
          if (!active) return;
          doCourteousNod();
          scheduleNextNod();
        }, 12000);
      }

      function scheduleNextBlink() {
        clearTimeout(blinkTimer);
        const delay = 8500 + Math.random() * 4500;
        blinkTimer = setTimeout(() => {
          if (!active) return;
          blinkOnce();
          scheduleNextBlink();
        }, delay);
      }

      function begin() {
        active = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        scaleWrap.classList.add('visible');

        baselineProjectedWidth = null;
        widthSamples = [];
        filteredWidth = null;
        targetScale = 1.0;
        currentScale = 1.0;
        scaleWrap.style.setProperty('--ar-scale', '1');

        // Даём сначала просто посмотреть в глаза читателю
        clearTimeout(nodTimer);
        nodTimer = setTimeout(() => {
          if (!active) return;
          doCourteousNod();
          scheduleNextNod();
        }, 2200);

        scheduleNextBlink();
      }

      function scheduleEnd() {
        if (hideTimer) clearTimeout(hideTimer);

        hideTimer = setTimeout(() => {
          active = false;

          clearTimeout(nodTimer);
          clearTimeout(blinkTimer);
          nodTimer = null;
          blinkTimer = null;

          pose.classList.remove('nod');
          pose.classList.remove('blink');
          scaleWrap.classList.remove('visible');

          baselineProjectedWidth = null;
          widthSamples = [];
          filteredWidth = null;
          targetScale = 1.0;
          currentScale = 1.0;
          scaleWrap.style.setProperty('--ar-scale', '1');

          hideTimer = null;
        }, 1700);
      }

      target.addEventListener('targetFound', () => {
        if (!active) {
          begin();
        } else if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
      });

      target.addEventListener('targetLost', scheduleEnd);

      requestAnimationFrame(updateScale);
    });
  </script>

</body>
</html>
