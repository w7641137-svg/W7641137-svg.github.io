<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Живая книга Вольфсона</title>

  <!-- Для пилота оставляем уже проверенную внешнюю загрузку библиотек.
       После стабилизации перенесём обе библиотеки локально в репозиторий. -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{font-family:Georgia,"Times New Roman",serif}

    #arRoot,a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}
    #arRoot{z-index:1}

    .panel{
      position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
      padding:24px;background:rgba(0,0,0,.93);color:#efe7d6
    }
    .panel.hidden{display:none}
    .card{
      width:min(520px,100%);padding:30px 24px 26px;text-align:center;
      border:1px solid rgba(239,231,214,.22);border-radius:18px;background:rgba(24,22,19,.82)
    }
    h1{margin:0 0 12px;font-size:clamp(26px,7vw,38px);font-weight:500;letter-spacing:.04em}
    p{margin:0 auto 22px;max-width:410px;font-size:16px;line-height:1.45;color:rgba(239,231,214,.82)}
    button{
      appearance:none;border:1px solid rgba(239,231,214,.55);border-radius:999px;padding:14px 24px;
      background:#efe7d6;color:#201b16;font:600 16px/1 Georgia,"Times New Roman",serif;min-width:210px
    }
    button:disabled{opacity:.45}
    .small{margin-top:14px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:rgba(239,231,214,.65)}
    #errorText{text-align:left;white-space:pre-line;margin:18px 0 20px;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:rgba(239,231,214,.86)}

    #hint{
      position:fixed;z-index:80;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);
      padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.88);
      font:13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap
    }
    #hint.show{opacity:1}

    /* Портрет НЕ приклеен к наклону страницы. */
    .portrait{
      --ar-scale:1;position:fixed;left:50%;top:48%;width:min(61vw,390px);aspect-ratio:4/5;z-index:30;
      pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(var(--ar-scale));
      transition:opacity .7s ease,transform .11s linear;will-change:transform,opacity
    }
    .portrait.visible{opacity:1}
    .portrait-stage{position:absolute;inset:0;perspective:1100px;transform-style:preserve-3d}
    .portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    #goetheTorso{z-index:1}
    #goetheHeadWrap{
      position:absolute;inset:0;z-index:2;transform-origin:50% 69%;transform-style:preserve-3d;
      will-change:transform;backface-visibility:hidden
    }
    #goetheHeadWrap.nod{animation:courteousNod 6.4s cubic-bezier(.36,0,.20,1) 1}
    @keyframes courteousNod{
      0%,15%,100%{transform:translateY(0) rotateX(0deg) scaleY(1)}
      38%{transform:translateY(2px) rotateX(3deg) scaleY(.992)}
      55%,66%{transform:translateY(5px) rotateX(7.2deg) scaleY(.972)}
      83%{transform:translateY(2px) rotateX(3deg) scaleY(.992)}
    }
    #goetheEyesClosed{
      position:absolute;left:32.5%;top:20%;width:35%;height:16%;z-index:5;opacity:0;object-fit:fill!important;
      transition:opacity .065s linear
    }
    #goetheHeadWrap.blink #goetheEyesClosed{opacity:1}
  
    /* V4: rigid cropped head. No scaleY, no downward squeeze, collar stays on torso. */
    #headWrap {
      position:absolute !important;
      left:20.1667% !important;
      top:2.9333% !important;
      width:58.1667% !important;
      height:54.4000% !important;
      inset:auto !important;
      z-index:2;
      transform-origin:50% 94% !important;
      transform-style:preserve-3d;
      will-change:transform;
      backface-visibility:hidden;
    }

    #headOpen {
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      object-fit:contain !important;
    }

    #eyesClosed {
      position:absolute !important;
      left:24.0688% !important;
      top:37.5000% !important;
      width:55.3009% !important;
      height:20.8333% !important;
      inset:auto !important;
      object-fit:fill !important;
    }

    #headWrap.nod {
      animation:rigidCourteousNod 6.2s cubic-bezier(.34,0,.18,1) 1 !important;
    }

    @keyframes rigidCourteousNod {
      0%, 18%, 100% {
        transform:perspective(1600px) rotateX(0deg) translateY(0);
      }
      42% {
        transform:perspective(1600px) rotateX(3.2deg) translateY(.5px);
      }
      58%, 68% {
        transform:perspective(1600px) rotateX(6.2deg) translateY(1px);
      }
      84% {
        transform:perspective(1600px) rotateX(3.0deg) translateY(.5px);
      }
    }

</style>
</head>
<body>
  <div id="arRoot"></div>

  <div id="launchPanel" class="panel">
    <div class="card">
      <h1>ЖИВАЯ КНИГА</h1>
      <p>Наведите камеру на автограф — и портрет появится над страницей. Камера включится только после Вашего нажатия.</p>
      <button id="startButton" disabled>ОЖИВИТЬ КНИГУ</button>
      <div id="status" class="small">Проверяем файлы портрета…</div>
    </div>
  </div>

  <div id="errorPanel" class="panel hidden">
    <div class="card">
      <h1>Не удалось запустить AR</h1>
      <div id="errorText"></div>
      <button id="retryButton">ПОПРОБОВАТЬ СНОВА</button>
    </div>
  </div>

  <div id="hint">Наведите камеру на автограф</div>

  <!-- Только PNG. Никаких picture/WebP на стадии пилота: меньше точек отказа. -->
  <div id="portrait-goethe" class="portrait" aria-hidden="true">
    <div class="portrait-stage">
      <img id="goetheTorso" src="./goethe_body_v4.png?v=4" alt="">
      <div id="goetheHeadWrap">
        <img id="goetheHeadOpen" src="./goethe_head_v4.png?v=4" alt="">
        <img id="goetheEyesClosed" src="./goethe_eyes_v4.png?v=4" alt="">
      </div>
    </div>
  </div>

  <script>
  (()=>{
    "use strict";

    const VERSION="v4-rigid-head-20260917";
    const launchPanel=document.getElementById("launchPanel");
    const errorPanel=document.getElementById("errorPanel");
    const startButton=document.getElementById("startButton");
    const retryButton=document.getElementById("retryButton");
    const status=document.getElementById("status");
    const errorText=document.getElementById("errorText");
    const hint=document.getElementById("hint");

    let scene=null, arSystem=null, active=false, targetEntity=null;
    let lossTimer=null, nodTimer=null, blinkTimer=null, starting=false;

    /* Убираем оставшийся от прошлой сборки Service Worker и его кэши.
       Именно на стадии частых обновлений он опасен: способен держать старые/404-ресурсы. */
    async function removeOldCacheLayer(){
      try{
        if("serviceWorker" in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if("caches" in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith("wolfson-live-book")).map(k=>caches.delete(k)));
        }
      }catch(e){}
    }

    function loadImage(url){
      return new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>resolve(url);
        img.onerror=()=>reject(new Error(url));
        img.src=url;
      });
    }

    async function preflightAssets(){
      const assets=[
        "./goethe_body_v4.png?v=4",
        "./goethe_head_v4.png?v=4",
        "./goethe_eyes_v4.png?v=4"
      ];
      await Promise.all(assets.map(loadImage));
    }

    function showFatal(message){
      launchPanel.classList.add("hidden");
      errorPanel.classList.remove("hidden");
      errorText.textContent=message;
    }

    function buildScene(){
      const root=document.getElementById("arRoot");
      root.innerHTML=`
        <a-scene id="scene"
          mindar-image="imageTargetSrc: ./targets.mind?v=4; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 2; missTolerance: 24; filterMinCF: 0.0005; filterBeta: 800;"
          color-space="sRGB"
          renderer="colorManagement: true; alpha: true; antialias: true"
          vr-mode-ui="enabled:false"
          device-orientation-permission-ui="enabled:false">
          <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
          <a-entity id="goetheTarget" mindar-image-target="targetIndex:0"></a-entity>
        </a-scene>`;

      scene=document.getElementById("scene");
      targetEntity=document.getElementById("goetheTarget");

      targetEntity.addEventListener("targetFound",onFound);
      targetEntity.addEventListener("targetLost",onLost);

      scene.addEventListener("loaded",()=>{
        arSystem=scene.systems["mindar-image-system"];
        startButton.disabled=false;
        status.textContent="Готово.";
      });

      scene.addEventListener("arReady",()=>{
        starting=false;
        launchPanel.classList.add("hidden");
        errorPanel.classList.add("hidden");
        hint.classList.add("show");
        setTimeout(()=>hint.classList.remove("show"),2400);
      });

      scene.addEventListener("arError",()=>{
        starting=false;
        showCameraError();
      });
    }

    function showCameraError(){
      showFatal(
        "Камера не включилась.\n\nЕсли Вы случайно запретили доступ к камере, разрешите камеру для этого сайта в настройках браузера и нажмите «Попробовать снова».\n\nЕсли ссылка открылась внутри другого приложения, откройте её непосредственно в Safari или Chrome."
      );
    }

    async function startAR(){
      if(!arSystem||starting)return;
      starting=true;
      startButton.disabled=true;
      retryButton.disabled=true;
      errorPanel.classList.add("hidden");
      status.textContent="Включаем камеру…";
      try{
        const r=arSystem.start();
        if(r&&typeof r.then==="function")await r;
      }catch(e){
        starting=false;
        showCameraError();
      }finally{
        startButton.disabled=false;
        retryButton.disabled=false;
      }
    }

    startButton.addEventListener("click",startAR);
    retryButton.addEventListener("click",startAR);

    const portrait=document.getElementById("portrait-goethe");
    const head=document.getElementById("goetheHeadWrap");

    function blink(){
      if(!active)return;
      head.classList.add("blink");
      setTimeout(()=>head.classList.remove("blink"),145);
    }

    function nod(){
      if(!active)return;

      /*
        V4: rigid-head nod.
        No scaleY. No 10px downward shift. No shoulder squeeze.
        Collar/cravat belong to torso and do not move.
      */
      head.classList.remove("nod");
      void head.offsetWidth;
      head.classList.add("nod");

      // One quiet blink close to the lower point.
      setTimeout(()=>{if(active)blink()},3650);
      setTimeout(()=>head.classList.remove("nod"),6250);
    }

    function scheduleNod(first=false){
      clearTimeout(nodTimer);
      nodTimer=setTimeout(()=>{
        if(!active)return;
        nod();
        scheduleNod(false);
      }, first?1800:15000);
    }

    function scheduleBlink(){
      clearTimeout(blinkTimer);
      blinkTimer=setTimeout(()=>{
        if(!active)return;
        blink();
        scheduleBlink();
      },8000+Math.random()*5000);
    }

    function onFound(){
      if(lossTimer){clearTimeout(lossTimer);lossTimer=null}
      if(active)return;
      active=true;
      resetScale();
      portrait.classList.add("visible");
      scheduleNod(true);
      scheduleBlink();
    }

    function onLost(){
      if(lossTimer)clearTimeout(lossTimer);
      lossTimer=setTimeout(()=>{
        active=false;
        clearTimeout(nodTimer);clearTimeout(blinkTimer);
        head.classList.remove("nod","blink");
        portrait.classList.remove("visible");
        resetScale();
        lossTimer=null;
      },1900);
    }

    /* Стабильное масштабирование по реальному изменению расстояния. */
    const ss={baseline:null,samples:[],window:[],target:1,current:1};
    const L=new THREE.Vector3(-.5,0,0),R=new THREE.Vector3(.5,0,0),LW=new THREE.Vector3(),RW=new THREE.Vector3();
    function median(a){const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
    function resetScale(){ss.baseline=null;ss.samples=[];ss.window=[];ss.target=1;ss.current=1;portrait.style.setProperty("--ar-scale","1")}
    function projectedWidth(){
      if(!active||!scene||!scene.camera||!targetEntity)return null;
      targetEntity.object3D.updateMatrixWorld(true);scene.camera.updateMatrixWorld(true);
      LW.copy(L).applyMatrix4(targetEntity.object3D.matrixWorld).project(scene.camera);
      RW.copy(R).applyMatrix4(targetEntity.object3D.matrixWorld).project(scene.camera);
      const w=Math.abs(RW.x-LW.x);return Number.isFinite(w)&&w>.001&&w<5?w:null;
    }
    function scaleLoop(){
      if(active){
        const m=projectedWidth();
        if(m){
          if(!ss.baseline){
            ss.samples.push(m);
            if(ss.samples.length>=20){ss.baseline=median(ss.samples);ss.samples=[]}
          }else{
            ss.window.push(m);if(ss.window.length>21)ss.window.shift();
            if(ss.window.length>=9){
              let ratio=median(ss.window)/ss.baseline;ratio=Math.max(.68,Math.min(1.55,ratio));
              if(Math.abs(ratio-ss.target)>=.085)ss.target=ratio;
              const d=ss.target-ss.current;let step=d*.035;step=Math.max(-.0028,Math.min(.0028,step));
              ss.current+=step;portrait.style.setProperty("--ar-scale",ss.current.toFixed(4));
            }
          }
        }
      }
      requestAnimationFrame(scaleLoop);
    }

    async function boot(){
      await removeOldCacheLayer();
      try{
        await preflightAssets();
        status.textContent="Файлы портрета загружены. Подготовка AR…";
        buildScene();
      }catch(e){
        showFatal("Не загрузился один из файлов портрета. AR остановлен специально — портрет без головы больше не показываем.\n\nЗагрузите заново три PNG-файла из новой сборки и обновите страницу.");
      }
      requestAnimationFrame(scaleLoop);
    }

    boot();
  })();
  </script>
</body>
</html>
