<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portraitOverlay {
      position: fixed;
      left: 50%;
      top: 46%;
      width: min(62vw, 390px);
      max-height: 72vh;
      object-fit: contain;
      transform: translate(-50%, -46%) scale(0.965);
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transition:
        opacity 650ms ease,
        transform 850ms cubic-bezier(.2,.8,.2,1);
      will-change: opacity, transform;
    }

    #portraitOverlay.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

<body>

  <img id="portraitOverlay" src="./goethe_portrait.png" alt="">

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 18;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Маркер нужен только для распознавания. Портрет к его наклону НЕ привязан. -->
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const target = document.getElementById('goetheTarget');
      const portrait = document.getElementById('portraitOverlay');

      let hideTimer = null;

      const showPortrait = () => {
        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
        portrait.classList.add('visible');
      };

      const scheduleHide = () => {
        if (hideTimer) clearTimeout(hideTimer);

        // Даже если трекинг на мгновение сорвался, портрет остаётся.
        hideTimer = setTimeout(() => {
          portrait.classList.remove('visible');
          hideTimer = null;
        }, 1400);
      };

      target.addEventListener('targetFound', showPortrait);
      target.addEventListener('targetLost', scheduleHide);
    });
  </script>

</body>
</html>
