<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Гёте — дополненная реальность</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Georgia, "Times New Roman", serif; }

    a-scene { position: fixed !important; inset: 0 !important; z-index: 1; }

    #portrait {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 49%;
      width: min(64vw, 430px);
      max-height: 76vh;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transform-origin: 50% 50%;
      transform: translate(-50%, -50%) scale(var(--ar-scale));
      transition: opacity 280ms ease;
      will-change: transform, opacity;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.32));
      user-select: none;
      -webkit-user-drag: none;
    }

    #portrait.visible { opacity: 1; }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #23211e 0, #0a0a0a 54%, #000 100%);
      padding: 28px;
      text-align: center;
    }

    #startCard { max-width: 520px; }
    #startCard h1 { margin: 0 0 14px; font-size: clamp(28px, 7vw, 44px); font-weight: 500; letter-spacing: .02em; }
    #startCard p { margin: 0 0 22px; color: #d8d2c8; font: 18px/1.45 Arial, sans-serif; }

    #startBtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      padding: 15px 26px;
      background: #f0ebe1;
      color: #111;
      font: 700 16px/1 Arial, sans-serif;
      letter-spacing: .03em;
      cursor: pointer;
    }
    #startBtn:disabled { opacity: .55; cursor: default; }

    #status {
      margin-top: 16px;
      min-height: 22px;
      color: #c9c3b8;
      font: 14px/1.35 Arial, sans-serif;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 30;
      transform: translateX(-50%);
      max-width: calc(100vw - 36px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.48);
      color: rgba(255,255,255,.9);
      font: 13px/1.2 Arial, sans-serif;
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #hint.show { opacity: 1; }

    #debug {
      display: none;
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      z-index: 200;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font: 12px/1.25 monospace;
      pointer-events: none;
    }
    body.debug #debug { display: block; }
  </style>
</head>
<body>
  <img id="portrait" src="./goethe_ar.png" alt="" />

  <div id="startScreen">
    <div id="startCard">
      <h1>Гёте</h1>
      <p>Нажмите кнопку и наведите камеру на страницу с автографом.</p>
      <button id="startBtn" type="button">ОЖИВИТЬ КНИГУ</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="hint">Наведите камеру на страницу с автографом Гёте</div>
  <div id="debug">—</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 3; missTolerance: 18; filterMinCF: 0.0005; filterBeta: 800;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
  (() => {
    const portrait = document.getElementById('portrait');
    const scene = document.getElementById('scene');
    const target = document.getElementById('target');
    const cameraEl = document.getElementById('camera');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const hint = document.getElementById('hint');
    const debug = document.getElementById('debug');

    const qs = new URLSearchParams(location.search);
    if (qs.get('debug') === '1') document.body.classList.add('debug');

    let found = false;
    let hideTimer = null;
    let baseMetric = null;
    let samples = [];
    let smoothScale = 1;
    let lastApplied = 1;
    let started = false;

    const world0 = new THREE.Vector3();
    const worldX = new THREE.Vector3();
    const worldY = new THREE.Vector3();
    const ndc0 = new THREE.Vector3();
    const ndcX = new THREE.Vector3();
    const ndcY = new THREE.Vector3();
    const local0 = new THREE.Vector3(0, 0, 0);
    const localX = new THREE.Vector3(1, 0, 0);
    const localY = new THREE.Vector3(0, 1, 0);

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function median(a) {
      if (!a.length) return null;
      const s = a.slice().sort((x,y) => x-y);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
    }

    // Измеряем ВИДИМЫЙ размер системы координат распознанной страницы
    // прямо в пикселях экрана. Это меняется, когда телефон реально
    // приближается/удаляется, но портрет сам остаётся вертикальным DOM-слоем.
    function projectedTargetMetric() {
      if (!target.object3D || !cameraEl.object3D || !cameraEl.getObject3D('camera')) return null;
      const cam = cameraEl.getObject3D('camera');
      target.object3D.updateMatrixWorld(true);
      cam.updateMatrixWorld(true);

      world0.copy(local0).applyMatrix4(target.object3D.matrixWorld);
      worldX.copy(localX).applyMatrix4(target.object3D.matrixWorld);
      worldY.copy(localY).applyMatrix4(target.object3D.matrixWorld);

      ndc0.copy(world0).project(cam);
      ndcX.copy(worldX).project(cam);
      ndcY.copy(worldY).project(cam);

      const w = innerWidth || 1;
      const h = innerHeight || 1;
      const xLen = Math.hypot((ndcX.x - ndc0.x) * w * 0.5, (ndcX.y - ndc0.y) * h * 0.5);
      const yLen = Math.hypot((ndcY.x - ndc0.x) * w * 0.5, (ndcY.y - ndc0.y) * h * 0.5);

      // max делает метрику менее чувствительной к наклону страницы вокруг одной оси.
      const metric = Math.max(xLen, yLen);
      return Number.isFinite(metric) && metric > 2 ? metric : null;
    }

    function resetCalibration() {
      baseMetric = null;
      samples = [];
      smoothScale = 1;
      lastApplied = 1;
      portrait.style.setProperty('--ar-scale', '1');
    }

    function renderLoop() {
      if (found) {
        const metric = projectedTargetMetric();
        if (metric) {
          if (!baseMetric) {
            samples.push(metric);
            if (samples.length >= 18) {
              baseMetric = median(samples);
              samples = [];
            }
          } else {
            // Телефон ближе -> метка больше -> портрет больше.
            // Телефон дальше -> метка меньше -> портрет меньше.
            let desired = clamp(metric / baseMetric, 0.62, 1.62);

            // Мёртвая зона 2.5% убирает микродрожь трекинга.
            if (Math.abs(desired - lastApplied) < 0.025) desired = lastApplied;

            // EMA + ограничение шага: масштаб меняется плавно, без рывков.
            const ema = smoothScale + (desired - smoothScale) * 0.13;
            const maxStep = 0.018;
            const delta = clamp(ema - smoothScale, -maxStep, maxStep);
            smoothScale = clamp(smoothScale + delta, 0.62, 1.62);

            // Не дёргаем DOM из-за тысячных долей.
            if (Math.abs(smoothScale - lastApplied) >= 0.004) {
              lastApplied = smoothScale;
              portrait.style.setProperty('--ar-scale', smoothScale.toFixed(4));
            }

            if (document.body.classList.contains('debug')) {
              debug.textContent = `metric ${metric.toFixed(1)} / base ${baseMetric.toFixed(1)}\nscale ${smoothScale.toFixed(3)}`;
            }
          }
        }
      }
      requestAnimationFrame(renderLoop);
    }

    target.addEventListener('targetFound', () => {
      found = true;
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      resetCalibration();
      portrait.classList.add('visible');
      hint.classList.remove('show');
    });

    target.addEventListener('targetLost', () => {
      found = false;
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        portrait.classList.remove('visible');
        resetCalibration();
        hint.classList.add('show');
      }, 900);
    });

    async function startAR() {
      if (started) return;
      started = true;
      startBtn.disabled = true;
      status.textContent = 'Запускаю камеру…';

      try {
        if (!scene.hasLoaded) {
          await new Promise(resolve => scene.addEventListener('loaded', resolve, { once: true }));
        }
        const system = scene.systems['mindar-image-system'];
        if (!system) throw new Error('MindAR не загрузился');
        await system.start();
        startScreen.style.display = 'none';
        hint.classList.add('show');
      } catch (err) {
        console.error(err);
        started = false;
        startBtn.disabled = false;
        status.innerHTML = 'Камера не запустилась. Разрешите доступ к камере в настройках сайта и повторите.';
      }
    }

    startBtn.addEventListener('click', startAR);
    requestAnimationFrame(renderLoop);
  })();
  </script>
</body>
</html>
