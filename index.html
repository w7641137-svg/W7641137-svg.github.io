<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Гёте — дополненная реальность</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portrait {
      --s: 1;
      position: fixed;
      left: 50%;
      top: 49%;
      width: min(68vw, 420px);
      max-height: 78vh;
      object-fit: contain;
      transform: translate(-50%, -50%) scale(var(--s));
      transform-origin: center center;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transition: opacity 420ms ease;
      will-change: transform, opacity;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.26));
    }

    #portrait.visible { opacity: 1; }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 35%, #29231d 0%, #12100e 52%, #050505 100%);
      color: #f1eadf;
      text-align: center;
    }

    #startCard {
      width: min(88vw, 430px);
      padding: 28px 24px 24px;
      border: 1px solid rgba(224,199,157,.34);
      background: rgba(15,13,11,.82);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    #startTitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      letter-spacing: .06em;
      margin: 0 0 9px;
      font-weight: 400;
    }

    #startSub {
      margin: 0 0 23px;
      font-size: 15px;
      line-height: 1.45;
      color: rgba(241,234,223,.77);
    }

    #startButton {
      appearance: none;
      border: 1px solid #d2b27e;
      background: #d2b27e;
      color: #16120e;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 14px 20px;
      min-width: 230px;
      cursor: pointer;
    }

    #startButton:disabled { opacity: .55; cursor: default; }

    #errorBox {
      display: none;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.45;
      color: #f0d7c7;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30;
      padding: 8px 12px;
      border-radius: 18px;
      background: rgba(0,0,0,.52);
      color: rgba(255,255,255,.88);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 300ms ease;
      pointer-events: none;
    }

    #hint.show { opacity: 1; }
  </style>
</head>
<body>

  <img id="portrait" src="./goethe_portrait.png" alt="">
  <div id="hint">Наведите камеру на страницу с автографом Гёте</div>

  <div id="startScreen">
    <div id="startCard">
      <h1 id="startTitle">И. В. ГЁТЕ</h1>
      <p id="startSub">Дополненная реальность книги</p>
      <button id="startButton" type="button">ОЖИВИТЬ КНИГУ</button>
      <div id="errorBox"></div>
    </div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      maxTrack: 1;
      uiLoading: yes;
      uiScanning: no;
      uiError: no;
      warmupTolerance: 2;
      missTolerance: 22;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const target = document.getElementById('goetheTarget');
      const cameraEl = document.getElementById('arCamera');
      const portrait = document.getElementById('portrait');
      const startScreen = document.getElementById('startScreen');
      const startButton = document.getElementById('startButton');
      const errorBox = document.getElementById('errorBox');
      const hint = document.getElementById('hint');

      let targetVisible = false;
      let hideTimer = null;
      let hintTimer = null;
      let baselineDistance = null;
      let smoothedScale = 1;
      let samples = [];

      const targetPos = new THREE.Vector3();
      const cameraPos = new THREE.Vector3();
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function median(a) {
        if (!a.length) return null;
        const s = [...a].sort((x,y) => x-y);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
      }

      function distanceToTarget() {
        if (!target.object3D || !cameraEl.object3D) return null;
        target.object3D.getWorldPosition(targetPos);
        cameraEl.object3D.getWorldPosition(cameraPos);
        const d = targetPos.distanceTo(cameraPos);
        return Number.isFinite(d) && d > 0.01 && d < 50 ? d : null;
      }

      function animateScale() {
        if (targetVisible) {
          const d = distanceToTarget();
          if (d) {
            if (!baselineDistance) {
              samples.push(d);
              if (samples.length >= 12) {
                baselineDistance = median(samples);
                samples = [];
              }
            } else {
              const desired = clamp(baselineDistance / d, 0.72, 1.55);
              const delta = desired - smoothedScale;
              if (Math.abs(delta) > 0.018) {
                smoothedScale += delta * 0.10;
                portrait.style.setProperty('--s', smoothedScale.toFixed(4));
              }
            }
          }
        }
        requestAnimationFrame(animateScale);
      }

      function showPortrait() {
        targetVisible = true;
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = null;
        samples = [];
        baselineDistance = null;
        portrait.classList.add('visible');
        hint.classList.remove('show');
      }

      function scheduleHide() {
        targetVisible = false;
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          portrait.classList.remove('visible');
          baselineDistance = null;
          samples = [];
          smoothedScale = 1;
          portrait.style.setProperty('--s', '1');
          hint.classList.add('show');
        }, 1400);
      }

      target.addEventListener('targetFound', showPortrait);
      target.addEventListener('targetLost', scheduleHide);

      function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent = msg;
      }

      startButton.addEventListener('click', async () => {
        startButton.disabled = true;
        startButton.textContent = 'ЗАПУСК КАМЕРЫ…';
        errorBox.style.display = 'none';
        try {
          const mindarSystem = scene.systems['mindar-image-system'];
          await mindarSystem.start();
          startScreen.style.display = 'none';
          hint.classList.add('show');
          clearTimeout(hintTimer);
          hintTimer = setTimeout(() => hint.classList.remove('show'), 5500);
        } catch (e) {
          console.error(e);
          startButton.disabled = false;
          startButton.textContent = 'ПОПРОБОВАТЬ СНОВА';
          showError('Камера не запустилась. Разрешите доступ к камере для этого сайта в настройках браузера и повторите запуск.');
        }
      });

      requestAnimationFrame(animateScale);
    });
  </script>
</body>
</html>
