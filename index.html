<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portraitWrap {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(62vw, 390px);
      max-width: 390px;
      aspect-ratio: 561 / 701;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(calc(var(--ar-scale) * 0.965));
      transition:
        opacity 650ms ease,
        transform 90ms linear;
      will-change: opacity, transform;
    }

    #portraitWrap.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(var(--ar-scale));
    }

    #portraitWrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1150ms ease-in-out;
      will-change: opacity;
      user-select: none;
      -webkit-user-drag: none;
    }

    #portraitWrap img.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="portraitWrap" aria-hidden="true">
    <img id="imgA" src="./goethe_frame1.png" alt="">
    <img id="imgB" src="./goethe_frame1.png" alt="">
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 22;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Маркер даёт только факт распознавания и расстояние.
         Его наклон и дрожание портрету не передаются. -->
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const framePaths = [
        './goethe_frame1.png',
        './goethe_frame2.png',
        './goethe_frame3.png',
        './goethe_frame4.png'
      ];

      framePaths.forEach(src => {
        const i = new Image();
        i.src = src;
      });

      // Спокойный цикл туда и обратно — без резкого прыжка 4 -> 1.
      const sequence = [0, 1, 2, 3, 2, 1];
      const stepDuration = 1550; // время между фазами, мс

      const target = document.getElementById('goetheTarget');
      const cameraEl = document.getElementById('arCamera');
      const wrap = document.getElementById('portraitWrap');
      const imgA = document.getElementById('imgA');
      const imgB = document.getElementById('imgB');

      let activeImg = imgA;
      let passiveImg = imgB;
      let sequencePos = 0;
      let loopTimer = null;
      let hideTimer = null;
      let targetVisible = false;

      let baselineDistance = null;
      let smoothedScale = 1.0;
      let calibrationSamples = [];

      const targetPos = new THREE.Vector3();
      const cameraPos = new THREE.Vector3();

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function getWorldDistance() {
        if (!target.object3D || !cameraEl.object3D) return null;

        target.object3D.getWorldPosition(targetPos);
        cameraEl.object3D.getWorldPosition(cameraPos);

        const d = targetPos.distanceTo(cameraPos);

        if (!Number.isFinite(d) || d < 0.01 || d > 50) return null;
        return d;
      }

      function median(arr) {
        if (!arr.length) return null;
        const s = [...arr].sort((a,b) => a-b);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
      }

      function updateScale() {
        if (targetVisible) {
          const d = getWorldDistance();

          if (d) {
            // Первые несколько кадров — спокойная автокалибровка
            // под обычное расстояние, с которого читатель открыл страницу.
            if (!baselineDistance) {
              calibrationSamples.push(d);

              if (calibrationSamples.length >= 12) {
                baselineDistance = median(calibrationSamples);
                calibrationSamples = [];
              }
            } else {
              // ближе камера => больше портрет
              // дальше камера => меньше портрет
              const desired = clamp(baselineDistance / d, 0.62, 1.75);

              // Сглаживание масштаба: реагирует на движение руки,
              // но не повторяет мелкую дрожь трекинга.
              smoothedScale += (desired - smoothedScale) * 0.12;

              wrap.style.setProperty(
                '--ar-scale',
                smoothedScale.toFixed(4)
              );
            }
          }
        }

        requestAnimationFrame(updateScale);
      }

      function crossfadeTo(frameIndex) {
        passiveImg.src = framePaths[frameIndex];

        // Двойной requestAnimationFrame даёт браузеру загрузить/отрисовать
        // новый кадр до начала мягкого перекрытия.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            passiveImg.classList.add('active');
            activeImg.classList.remove('active');

            const tmp = activeImg;
            activeImg = passiveImg;
            passiveImg = tmp;
          });
        });
      }

      function scheduleNextFrame() {
        clearTimeout(loopTimer);

        loopTimer = setTimeout(() => {
          if (!targetVisible) return;

          sequencePos = (sequencePos + 1) % sequence.length;
          crossfadeTo(sequence[sequencePos]);

          scheduleNextFrame();
        }, stepDuration);
      }

      function startLoop() {
        clearTimeout(loopTimer);

        sequencePos = 0;
        activeImg.src = framePaths[sequence[0]];
        passiveImg.src = framePaths[sequence[1]];

        activeImg.classList.add('active');
        passiveImg.classList.remove('active');

        scheduleNextFrame();
      }

      function stopLoop() {
        clearTimeout(loopTimer);
        loopTimer = null;
      }

      const showPortrait = () => {
        targetVisible = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        calibrationSamples = [];
        baselineDistance = null;

        if (!wrap.classList.contains('visible')) {
          startLoop();
        }

        wrap.classList.add('visible');
      };

      const scheduleHide = () => {
        targetVisible = false;

        if (hideTimer) clearTimeout(hideTimer);

        // Краткая потеря цели не должна мигать портретом.
        hideTimer = setTimeout(() => {
          wrap.classList.remove('visible');
          stopLoop();

          baselineDistance = null;
          calibrationSamples = [];
          smoothedScale = 1.0;
          wrap.style.setProperty('--ar-scale', '1');

          hideTimer = null;
        }, 1600);
      };

      target.addEventListener('targetFound', showPortrait);
      target.addEventListener('targetLost', scheduleHide);

      requestAnimationFrame(updateScale);
    });
  </script>

</body>
</html>
