<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portraitWrap {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(62vw, 390px);
      max-width: 390px;
      aspect-ratio: 561 / 701;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(calc(var(--ar-scale) * 0.965));
      transition:
        opacity 600ms ease,
        transform 120ms linear;
      will-change: opacity, transform;
    }

    #portraitWrap.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(var(--ar-scale));
    }

    #portraitWrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 420ms ease-in-out;
      will-change: opacity;
      user-select: none;
      -webkit-user-drag: none;
    }

    #portraitWrap img.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="portraitWrap" aria-hidden="true">
    <img id="imgA" src="./goethe_frame1.png" alt="">
    <img id="imgB" src="./goethe_frame1.png" alt="">
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 18;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Маркер нужен только для распознавания и измерения расстояния -->
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const framePaths = [
        './goethe_frame1.png',
        './goethe_frame2.png',
        './goethe_frame3.png',
        './goethe_frame4.png'
      ];

      // Предзагрузка кадров
      framePaths.forEach(src => { const i = new Image(); i.src = src; });

      const durations = [800, 700, 900, 800];

      const target = document.getElementById('goetheTarget');
      const wrap = document.getElementById('portraitWrap');
      const imgA = document.getElementById('imgA');
      const imgB = document.getElementById('imgB');

      let hideTimer = null;
      let baselineDistance = null;
      let smoothedScale = 1.0;
      let targetVisible = false;

      let activeImg = imgA;
      let passiveImg = imgB;
      let currentFrame = 0;
      let loopTimer = null;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function currentDistance() {
        const p = target.object3D.position;
        const d = Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z);
        return Number.isFinite(d) && d > 0.001 ? d : null;
      }

      function animateScale() {
        if (targetVisible) {
          const d = currentDistance();
          if (d) {
            if (!baselineDistance) baselineDistance = d;
            const desired = clamp(baselineDistance / d, 0.72, 1.55);
            smoothedScale += (desired - smoothedScale) * 0.075;
            wrap.style.setProperty('--ar-scale', smoothedScale.toFixed(4));
          }
        }
        requestAnimationFrame(animateScale);
      }

      function crossfadeTo(index) {
        passiveImg.src = framePaths[index];
        passiveImg.classList.add('active');
        activeImg.classList.remove('active');

        const tmp = activeImg;
        activeImg = passiveImg;
        passiveImg = tmp;
        currentFrame = index;
      }

      function scheduleNextFrame() {
        clearTimeout(loopTimer);
        loopTimer = setTimeout(() => {
          if (!targetVisible) return;
          const next = (currentFrame + 1) % framePaths.length;
          crossfadeTo(next);
          scheduleNextFrame();
        }, durations[currentFrame]);
      }

      function startLoop() {
        clearTimeout(loopTimer);
        currentFrame = 0;
        activeImg.src = framePaths[0];
        passiveImg.src = framePaths[1];
        activeImg.classList.add('active');
        passiveImg.classList.remove('active');
        scheduleNextFrame();
      }

      function stopLoop() {
        clearTimeout(loopTimer);
        loopTimer = null;
      }

      const showPortrait = () => {
        targetVisible = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        const d = currentDistance();
        if (d && !baselineDistance) baselineDistance = d;

        if (!wrap.classList.contains('visible')) {
          startLoop();
        }

        wrap.classList.add('visible');
      };

      const scheduleHide = () => {
        targetVisible = false;

        if (hideTimer) clearTimeout(hideTimer);

        hideTimer = setTimeout(() => {
          wrap.classList.remove('visible');
          stopLoop();
          hideTimer = null;
          baselineDistance = null;
          smoothedScale = 1.0;
          wrap.style.setProperty('--ar-scale', '1');
        }, 1400);
      };

      target.addEventListener('targetFound', showPortrait);
      target.addEventListener('targetLost', scheduleHide);

      requestAnimationFrame(animateScale);
    });
  </script>

</body>
</html>
