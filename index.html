<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    /* Внешний слой отвечает ТОЛЬКО за положение и масштаб. */
    #portraitScaleWrap {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(60vw, 380px);
      aspect-ratio: 4 / 5;
      z-index: 20;
      pointer-events: none;
      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(var(--ar-scale));

      transition:
        opacity 650ms ease,
        transform 110ms linear;

      will-change: transform, opacity;
      perspective: 900px;
    }

    #portraitScaleWrap.visible {
      opacity: 1;
    }

    /* Внутренний слой отвечает ТОЛЬКО за деликатный кивок. */
    #portraitPose {
      position: absolute;
      inset: 0;
      transform-origin: 50% 78%;
      will-change: transform;
    }

    #portraitPose.nod {
      animation: gentleNod 2.5s cubic-bezier(.42,0,.25,1) 1;
    }

    @keyframes gentleNod {
      0%, 100% {
        transform: translateY(0) rotateX(0deg);
      }

      48% {
        transform: translateY(5px) rotateX(0.9deg);
      }

      66% {
        transform: translateY(3px) rotateX(0.45deg);
      }
    }

    #portraitPose img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #openImg {
      opacity: 1;
    }

    #blinkImg {
      opacity: 0;
      transition: opacity 75ms linear;
    }

    #portraitPose.blink #blinkImg {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="portraitScaleWrap">
    <div id="portraitPose">
      <img id="openImg" src="./goethe_open.png" alt="">
      <img id="blinkImg" src="./goethe_blink.png" alt="">
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 24;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Маркер только распознаётся. Его наклон портрету не передаётся. -->
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.getElementById('scene');
      const target = document.getElementById('goetheTarget');

      const scaleWrap = document.getElementById('portraitScaleWrap');
      const pose = document.getElementById('portraitPose');

      let active = false;
      let hideTimer = null;

      let nodTimer = null;
      let blinkTimer = null;

      let baselineProjectedWidth = null;
      let widthSamples = [];
      let smoothedScale = 1.0;

      const leftLocal  = new THREE.Vector3(-0.5, 0, 0);
      const rightLocal = new THREE.Vector3( 0.5, 0, 0);
      const leftWorld  = new THREE.Vector3();
      const rightWorld = new THREE.Vector3();

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function median(a) {
        if (!a.length) return null;
        const s = [...a].sort((x,y) => x-y);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
      }

      /*
       * Самый надёжный способ для нашей задачи:
       * измеряем, насколько ШИРОКО сама страница выглядит в кадре.
       *
       * Телефон ближе -> страница на экране крупнее -> портрет крупнее.
       * Телефон дальше -> страница меньше -> портрет меньше.
       */
      function getProjectedTargetWidth() {
        const cam = scene.camera;

        if (!cam || !target.object3D) return null;

        target.object3D.updateMatrixWorld(true);
        cam.updateMatrixWorld(true);

        leftWorld.copy(leftLocal)
          .applyMatrix4(target.object3D.matrixWorld)
          .project(cam);

        rightWorld.copy(rightLocal)
          .applyMatrix4(target.object3D.matrixWorld)
          .project(cam);

        const w = Math.abs(rightWorld.x - leftWorld.x);

        if (!Number.isFinite(w) || w < 0.001 || w > 5) return null;
        return w;
      }

      function updateScale() {
        if (active) {
          const currentWidth = getProjectedTargetWidth();

          if (currentWidth) {
            if (!baselineProjectedWidth) {
              widthSamples.push(currentWidth);

              if (widthSamples.length >= 12) {
                baselineProjectedWidth = median(widthSamples);
                widthSamples = [];
              }
            } else {
              const desired = clamp(
                currentWidth / baselineProjectedWidth,
                0.62,
                1.80
              );

              smoothedScale += (desired - smoothedScale) * 0.12;

              scaleWrap.style.setProperty(
                '--ar-scale',
                smoothedScale.toFixed(4)
              );
            }
          }
        }

        requestAnimationFrame(updateScale);
      }

      function blinkOnce() {
        if (!active) return;

        pose.classList.add('blink');

        setTimeout(() => {
          pose.classList.remove('blink');
        }, 155);
      }

      function doGreetingNod() {
        if (!active) return;

        pose.classList.remove('nod');

        // Перезапуск CSS-анимации.
        void pose.offsetWidth;

        pose.classList.add('nod');

        // Моргание почти в нижней точке кивка.
        setTimeout(() => {
          blinkOnce();
        }, 1120);

        setTimeout(() => {
          pose.classList.remove('nod');
        }, 2550);
      }

      function scheduleNextNod() {
        clearTimeout(nodTimer);

        nodTimer = setTimeout(() => {
          doGreetingNod();

          if (active) scheduleNextNod();
        }, 10500);
      }

      function scheduleNextBlink() {
        clearTimeout(blinkTimer);

        const delay = 6500 + Math.random() * 4500;

        blinkTimer = setTimeout(() => {
          blinkOnce();

          if (active) scheduleNextBlink();
        }, delay);
      }

      function begin() {
        active = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        scaleWrap.classList.add('visible');

        baselineProjectedWidth = null;
        widthSamples = [];
        smoothedScale = 1.0;
        scaleWrap.style.setProperty('--ar-scale', '1');

        // Не кланяется сразу в лицо — сначала "смотрит" на читателя.
        clearTimeout(nodTimer);
        nodTimer = setTimeout(() => {
          doGreetingNod();
          scheduleNextNod();
        }, 1800);

        scheduleNextBlink();
      }

      function scheduleEnd() {
        if (hideTimer) clearTimeout(hideTimer);

        hideTimer = setTimeout(() => {
          active = false;

          clearTimeout(nodTimer);
          clearTimeout(blinkTimer);

          nodTimer = null;
          blinkTimer = null;

          pose.classList.remove('nod');
          pose.classList.remove('blink');
          scaleWrap.classList.remove('visible');

          baselineProjectedWidth = null;
          widthSamples = [];
          smoothedScale = 1.0;
          scaleWrap.style.setProperty('--ar-scale', '1');

          hideTimer = null;
        }, 1700);
      }

      target.addEventListener('targetFound', () => {
        if (!active) {
          begin();
        } else if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
      });

      target.addEventListener('targetLost', () => {
        scheduleEnd();
      });

      requestAnimationFrame(updateScale);
    });
  </script>

</body>
</html>
