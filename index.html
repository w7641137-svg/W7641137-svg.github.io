<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portraitWrap {
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(60vw, 380px);
      max-width: 380px;
      aspect-ratio: 4 / 5;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.985);
      transition: opacity 700ms ease, transform 700ms ease;
      will-change: transform, opacity;
    }

    #portraitWrap.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Деликатный приветственный кивок */
    #portraitWrap.nodding {
      animation: nodCycle 7.2s ease-in-out infinite;
      transform-origin: 50% 18%;
    }

    @keyframes nodCycle {
      0%, 26%, 100% {
        transform: translate(-50%, -50%) rotate(0deg) translateY(0px) scale(1);
      }
      37% {
        transform: translate(-50%, -49.1%) rotate(0.18deg) translateY(4px) scale(1);
      }
      48% {
        transform: translate(-50%, -48.3%) rotate(0.35deg) translateY(9px) scale(1);
      }
      60% {
        transform: translate(-50%, -49.1%) rotate(0.12deg) translateY(4px) scale(1);
      }
      72% {
        transform: translate(-50%, -50%) rotate(0deg) translateY(0px) scale(1);
      }
    }

    #portraitWrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #openImg {
      opacity: 1;
    }

    #blinkImg {
      opacity: 0;
      transition: opacity 80ms linear;
    }

    #portraitWrap.blink #blinkImg {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="portraitWrap" aria-hidden="true">
    <img id="openImg" src="./goethe_open.png" alt="">
    <img id="blinkImg" src="./goethe_blink.png" alt="">
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 24;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const wrap = document.getElementById('portraitWrap');
      const target = document.getElementById('goetheTarget');

      let hideTimer = null;
      let blinkLoop = null;
      let active = false;

      function doBlink() {
        if (!active) return;

        // Моргание короткое и редкое.
        wrap.classList.add('blink');
        setTimeout(() => wrap.classList.remove('blink'), 170);

        // Второе короткое смыкание — естественнее, чем один щелчок.
        setTimeout(() => {
          if (!active) return;
          wrap.classList.add('blink');
          setTimeout(() => wrap.classList.remove('blink'), 120);
        }, 260);
      }

      function startBlinkLoop() {
        clearInterval(blinkLoop);
        blinkLoop = setInterval(() => {
          // Моргание происходит спокойно и не слишком часто.
          doBlink();
        }, 7200);
      }

      function showPortrait() {
        active = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        wrap.classList.add('visible');
        wrap.classList.add('nodding');

        if (!blinkLoop) {
          // Первое моргание не сразу, чтобы сначала был спокойный взгляд.
          setTimeout(() => {
            if (active) doBlink();
          }, 4100);
          startBlinkLoop();
        }
      }

      function hidePortraitDelayed() {
        active = false;

        if (hideTimer) clearTimeout(hideTimer);

        hideTimer = setTimeout(() => {
          wrap.classList.remove('visible');
          wrap.classList.remove('nodding');
          wrap.classList.remove('blink');

          clearInterval(blinkLoop);
          blinkLoop = null;
          hideTimer = null;
        }, 1600);
      }

      target.addEventListener('targetFound', showPortrait);
      target.addEventListener('targetLost', hidePortraitDelayed);
    });
  </script>

</body>
</html>
