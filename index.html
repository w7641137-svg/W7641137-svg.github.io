<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Гёте — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1;
    }

    #portraitCanvas {
      --ar-scale: 1;
      position: fixed;
      left: 50%;
      top: 48%;
      width: min(62vw, 390px);
      height: auto;
      aspect-ratio: 4 / 5;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(calc(var(--ar-scale) * 0.965));
      transition:
        opacity 650ms ease,
        transform 90ms linear;
      will-change: opacity, transform;
    }

    #portraitCanvas.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(var(--ar-scale));
    }
  </style>
</head>

<body>

  <canvas id="portraitCanvas" width="360" height="450"></canvas>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
      warmupTolerance: 2;
      missTolerance: 22;
      filterMinCF: 0.0005;
      filterBeta: 800;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera id="arCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Страница только распознаётся.
         Её наклон и дрожание портрету не передаются. -->
    <a-entity id="goetheTarget" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.getElementById('scene');
      const target = document.getElementById('goetheTarget');
      const canvas = document.getElementById('portraitCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });

      const sheet = new Image();
      sheet.src = './goethe_motion_sheet.png';

      const FRAME_W = 360;
      const FRAME_H = 450;
      const COLS = 8;
      const FRAME_COUNT = 48;
      const FPS = 12;
      const FRAME_MS = 1000 / FPS;

      let sheetReady = false;
      let currentFrame = 0;
      let lastFrameTime = 0;

      let targetVisible = false;
      let portraitSessionActive = false;
      let hideTimer = null;

      let baselineDepth = null;
      let depthSamples = [];
      let smoothedScale = 1.0;

      const worldPos = new THREE.Vector3();
      const cameraSpacePos = new THREE.Vector3();

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function median(values) {
        if (!values.length) return null;
        const a = [...values].sort((x, y) => x - y);
        const m = Math.floor(a.length / 2);
        return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
      }

      function drawFrame(index) {
        if (!sheetReady) return;

        const col = index % COLS;
        const row = Math.floor(index / COLS);

        ctx.clearRect(0, 0, FRAME_W, FRAME_H);
        ctx.drawImage(
          sheet,
          col * FRAME_W, row * FRAME_H,
          FRAME_W, FRAME_H,
          0, 0,
          FRAME_W, FRAME_H
        );
      }

      sheet.onload = () => {
        sheetReady = true;
        drawFrame(0);
      };

      function getCameraDepth() {
        const cam = sceneEl.camera;
        if (!cam || !target.object3D) return null;

        target.object3D.getWorldPosition(worldPos);

        cameraSpacePos.copy(worldPos);
        cameraSpacePos.applyMatrix4(cam.matrixWorldInverse);

        const depth = Math.abs(cameraSpacePos.z);

        if (!Number.isFinite(depth) || depth < 0.01 || depth > 50) return null;
        return depth;
      }

      function updateScale() {
        if (targetVisible && portraitSessionActive) {
          const depth = getCameraDepth();

          if (depth) {
            if (!baselineDepth) {
              depthSamples.push(depth);

              if (depthSamples.length >= 10) {
                baselineDepth = median(depthSamples);
                depthSamples = [];
              }
            } else {
              // Приближаем телефон -> портрет растёт.
              // Отдаляем -> уменьшается.
              const desired = clamp(
                Math.pow(baselineDepth / depth, 0.92),
                0.60,
                1.80
              );

              smoothedScale += (desired - smoothedScale) * 0.14;

              canvas.style.setProperty(
                '--ar-scale',
                smoothedScale.toFixed(4)
              );
            }
          }
        }

        requestAnimationFrame(updateScale);
      }

      function animatePortrait(now) {
        if (
          portraitSessionActive &&
          sheetReady &&
          now - lastFrameTime >= FRAME_MS
        ) {
          lastFrameTime = now;
          currentFrame = (currentFrame + 1) % FRAME_COUNT;
          drawFrame(currentFrame);
        }

        requestAnimationFrame(animatePortrait);
      }

      function beginSession() {
        portraitSessionActive = true;
        targetVisible = true;

        baselineDepth = null;
        depthSamples = [];
        smoothedScale = 1.0;
        canvas.style.setProperty('--ar-scale', '1');

        currentFrame = 0;
        lastFrameTime = performance.now();
        drawFrame(0);

        canvas.classList.add('visible');
      }

      function endSession() {
        portraitSessionActive = false;
        targetVisible = false;

        baselineDepth = null;
        depthSamples = [];
        smoothedScale = 1.0;
        canvas.style.setProperty('--ar-scale', '1');

        canvas.classList.remove('visible');
      }

      target.addEventListener('targetFound', () => {
        targetVisible = true;

        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }

        // Важно: повторное распознавание после краткого срыва
        // НЕ перекалибровывает расстояние.
        if (!portraitSessionActive) {
          beginSession();
        }
      });

      target.addEventListener('targetLost', () => {
        targetVisible = false;

        if (hideTimer) clearTimeout(hideTimer);

        // Короткий срыв камеры не уничтожает портрет и не сбрасывает масштаб.
        hideTimer = setTimeout(() => {
          endSession();
          hideTimer = null;
        }, 1700);
      });

      requestAnimationFrame(updateScale);
      requestAnimationFrame(animatePortrait);
    });
  </script>

</body>
</html>
