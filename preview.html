<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 — проверка кивка</title><style>html,body{margin:0;min-height:100%;background:#171512;color:#eee;font-family:Georgia,serif}.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}.stage{width:min(70vw,390px);aspect-ratio:4/5;position:relative;background:#d8d2c5}.stage canvas{position:absolute;inset:0;width:100%;height:100%}button{padding:12px 20px;border-radius:999px;border:0;font:16px Georgia,serif}.note{max-width:520px;text-align:center;line-height:1.4;color:#bbb}</style></head><body><div class="wrap"><div class="stage"><canvas id="c" width="640" height="800"></canvas></div><button id="go">ПОКАЗАТЬ КИВОК</button><div class="note">V6: в каждый момент существует ровно один кадр. Никаких наложений, crossfade и второй головы.</div></div><script src="heroes.js?v=6"></script><script src="sequence-player.js?v=6"></script><script>const p=createCanvasSequencePlayer({canvas:document.getElementById('c')});(async()=>{await p.load(window.HEROES[0]);})();document.getElementById('go').onclick=()=>{p.stop();setTimeout(()=>p.start(),30)};</script></body></html>
